<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスタリング教材</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; color: #222; background: #fff; padding: 1.5rem; margin: 0 auto;font-size: 18px; }
h1 { font-size: 18px; font-weight: 500; margin-bottom: 1rem; }
.tabs { display: flex; gap: 6px; padding: 0 0 0.75rem; flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: 8px; border: 1px solid #ccc; font-size: 18px; cursor: pointer; background: transparent; color: #555; }
.tab.active { background: #f0f0f0; color: #111; font-weight: 500; border-color: #999; }
.panel { display: none; } .panel.active { display: block; }
canvas { border: 1px solid #ddd; border-radius: 8px; background: #fff; display: block; }
.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0.75rem 0; }
.btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #ccc; font-size: 18px; cursor: pointer; background: transparent; color: #222; }
.btn:hover { background: #f5f5f5; }
.btn.primary { background: #e8f0fb; color: #1a5cb0; border-color: #a8c4e8; }
.btn:disabled { opacity: 0.4; cursor: default; }
select { padding: 5px 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 18px; background: #fff; color: #222; cursor: pointer; }
.info-box { border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.7; margin: 0.5rem 0; min-height: 3.4em; }.info-neutral { background: #f7f7f7; color: #555; }
.info-measure { background: #fff8e1; color: #8a6000; }
.info-merge   { background: #e8f5e9; color: #1b5e20; }
.step-badge { font-size: 15px; color: #888; min-width: 90px; }
.phase-label { font-size: 14px; font-weight: 600; padding: 2px 8px; border-radius: 8px; display: inline-block; margin-bottom: 6px; }
.phase-measure { background: #fff8e1; color: #8a6000; }
.phase-merge   { background: #e8f5e9; color: #1b5e20; }
.main-layout { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.canvases { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; min-width: 300px; }
.canvas-wrap { flex: 1; min-width: 200px; }
.canvas-label { font-size: 15px; color: #888; margin-bottom: 4px; }
.dist-panel { min-width: 170px; flex: 0 0 170px; }
.dist-panel-label { font-size: 15px; color: #888; margin-bottom: 4px; }
.dist-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.dist-table th { font-size: 14px; font-weight: 500; color: #888; text-align: left; padding: 3px 6px; border-bottom: 1px solid #eee; }
.dist-table td { padding: 4px 6px; border-bottom: 1px solid #eee; color: #222; }
.dist-table tr.min-row td { background: #fdecea; color: #b71c1c; font-weight: 500; }
.dist-table-wrap { border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #fff; }
.note { font-size: 14px; color: #bbb; margin-top: 8px; }
</style>
</head>
<body>
<h1>クラスタリング インタラクティブ教材</h1>

<div class="tabs">
  <button class="tab active" onclick="switchTab('hierarchical', this)">階層的クラスタリング</button>
  <button class="tab" onclick="switchTab('kmeans', this)">k-means</button>
</div>

<!-- ===== 階層的クラスタリング ===== -->
<div id="panel-hierarchical" class="panel active">
  <div class="controls">
    <select id="linkage-method" onchange="resetHier()">
      <option value="single">最近法 (single linkage)</option>
      <option value="complete">最遠法 (complete linkage)</option>
      <option value="ward">ウォード法 (Ward)</option>
    </select>
    <button class="btn primary" id="btn-step" onclick="stepHier()">次へ ▶</button>
    <button class="btn" onclick="autoHier()">自動再生</button>
    <button class="btn" onclick="resetHier()">リセット</button>
    <span class="step-badge" id="hier-step-info">結合 0 / ?</span>
  </div>
  <div id="hier-phase-label" class="phase-label phase-measure">① 距離を測る</div>
  <div id="hier-info" class="info-box info-neutral">「次へ」で距離の計測から始まります。点はクリックで移動できます。</div>
  <div class="main-layout">
    <div class="canvases">
      <div class="canvas-wrap">
        <div class="canvas-label">散布図</div>
        <canvas id="hierCanvas" width="400" height="400" onclick="hierClick(event)"></canvas>
      </div>
      <div class="canvas-wrap">
        <div class="canvas-label">デンドログラム</div>
        <canvas id="dendCanvas" width="400" height="400"></canvas>
      </div>
    </div>
    <div class="dist-panel">
      <div class="dist-panel-label">クラスタ間距離</div>
      <div class="dist-table-wrap">
        <table class="dist-table">
          <thead><tr><th>A</th><th>B</th><th>距離</th></tr></thead>
          <tbody id="dist-tbody">
            <tr><td colspan="3" style="color:#aaa;padding:8px 6px;font-size:15px;">ステップを進めると<br>表示されます</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <p class="note">※ 散布図上の点をクリックすると位置を移動できます</p>
</div>

<!-- ===== k-means ===== -->
<div id="panel-kmeans" class="panel">
  <div class="controls">
    <span style="font-size:16px;color:#666;">k =</span>
    <input type="range" min="2" max="5" value="3" id="k-slider"
      oninput="document.getElementById('k-val').textContent=this.value; resetKmeans();"
      style="width:80px;">
    <span id="k-val" style="font-size:16px;font-weight:500;min-width:16px;">3</span>
    <button class="btn primary" id="btn-km-step" onclick="stepKmeans()">次のステップ ▶</button>
    <button class="btn" onclick="autoKmeans()">自動再生</button>
    <button class="btn" onclick="resetKmeans()">リセット</button>
    <span class="step-badge" id="km-step-info">ステップ 0</span>
  </div>
  <div id="km-phase-label" class="phase-label phase-measure">手順1：ランダム割り当て前</div>
  <div id="km-info" class="info-box info-neutral">
    「次のステップ」で各点にランダムにクラスタを割り当てます（手順1）。
  </div>
  <canvas id="kmCanvas" width="680" height="300" onclick="kmClick(event)"></canvas>
  <p class="note">※ 散布図上の点をクリックすると位置を移動できます</p>
</div>

<script>
const COLORS  = ['#378ADD','#D85A30','#1D9E75','#D4537E','#BA7517','#7F77DD'];
const LCOLORS = ['#B5D4F4','#F5C4B3','#9FE1CB','#F4C0D1','#FAC775','#CECBF6'];
function dist(a,b){ return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2); }

/* =====================================================================
   階層的クラスタリング
   ===================================================================== */
let hPts=[], hClusters=[], hMerges=[], hMergeIdx=0, hPhase='init', hAutoTimer=null;

function initHier(){
  hPts=[
    {x:60,y:80},{x:90,y:60},{x:75,y:110},
    {x:200,y:70},{x:230,y:90},{x:215,y:50},
    {x:140,y:200},{x:160,y:230},{x:120,y:220},
    {x:280,y:180},{x:260,y:210}
  ];
  resetHier();
}

function clusterLabel(cl){ return '{'+cl.map(i=>i+1).join(',')+'}';}

function clusterDist(ca,cb,method){
  const am=ca.map(i=>hPts[i]), bm=cb.map(i=>hPts[i]);
  if(method==='single')   return Math.min(...am.flatMap(a=>bm.map(b=>dist(a,b))));
  if(method==='complete') return Math.max(...am.flatMap(a=>bm.map(b=>dist(a,b))));
  if(method==='ward'){
    const ss=arr=>{
      const mx=arr.reduce((s,p)=>s+p.x,0)/arr.length,
            my=arr.reduce((s,p)=>s+p.y,0)/arr.length;
      return arr.reduce((s,p)=>s+(p.x-mx)**2+(p.y-my)**2,0);
    };
    return ss([...am,...bm])-ss(am)-ss(bm);
  }
}

function getLineEndpoints(ca,cb,method){
  const am=ca.map(i=>hPts[i]), bm=cb.map(i=>hPts[i]);
  if(method==='single'){
    let best=Infinity,pa=am[0],pb=bm[0];
    am.forEach(a=>bm.forEach(b=>{const d=dist(a,b);if(d<best){best=d;pa=a;pb=b;}}));
    return {ax:pa.x,ay:pa.y,bx:pb.x,by:pb.y};
  }
  if(method==='complete'){
    let best=-Infinity,pa=am[0],pb=bm[0];
    am.forEach(a=>bm.forEach(b=>{const d=dist(a,b);if(d>best){best=d;pa=a;pb=b;}}));
    return {ax:pa.x,ay:pa.y,bx:pb.x,by:pb.y};
  }
  const cA={x:am.reduce((s,p)=>s+p.x,0)/am.length,y:am.reduce((s,p)=>s+p.y,0)/am.length};
  const cB={x:bm.reduce((s,p)=>s+p.x,0)/bm.length,y:bm.reduce((s,p)=>s+p.y,0)/bm.length};
  return {ax:cA.x,ay:cA.y,bx:cB.x,by:cB.y};
}

function buildMerges(){
  const method=document.getElementById('linkage-method').value;
  let cls=hPts.map((_,i)=>[i]);
  hMerges=[];
  while(cls.length>1){
    let minD=Infinity,mi=-1,mj=-1;
    for(let i=0;i<cls.length;i++) for(let j=i+1;j<cls.length;j++){
      const d=clusterDist(cls[i],cls[j],method);
      if(d<minD){minD=d;mi=i;mj=j;}
    }
    const allDists=[];
    for(let i=0;i<cls.length;i++) for(let j=i+1;j<cls.length;j++){
      allDists.push({
        ca:[...cls[i]],cb:[...cls[j]],
        d:clusterDist(cls[i],cls[j],method),
        isMin:(i===mi&&j===mj),
        la:clusterLabel(cls[i]),lb:clusterLabel(cls[j])
      });
    }
    allDists.sort((a,b)=>a.d-b.d);
    hMerges.push({mi,mj,d:minD,allDists});
    const merged=[...cls[mi],...cls[mj]];
    cls=cls.filter((_,k)=>k!==mi&&k!==mj);
    cls.push(merged);
  }
}

function resetHier(){
  clearInterval(hAutoTimer);
  buildMerges();
  hClusters=hPts.map((_,i)=>[i]);
  hMergeIdx=0; hPhase='init';
  document.getElementById('btn-step').disabled=false;
  setHierPhaseUI('init',0);
  clearDistTable();
  drawHier(); drawDend(0);
}

function clearDistTable(){
  document.getElementById('dist-tbody').innerHTML=
    '<tr><td colspan="3" style="color:#aaa;padding:8px 6px;font-size:11px;">ステップを進めると<br>表示されます</td></tr>';
}

function updateDistTable(allDists){
  const tbody=document.getElementById('dist-tbody');
  tbody.innerHTML='';
  allDists.forEach(({la,lb,d,isMin})=>{
    const tr=document.createElement('tr');
    if(isMin) tr.className='min-row';
    tr.innerHTML=`<td>${la}</td><td>${lb}</td><td>${d.toFixed(1)}</td>`;
    tbody.appendChild(tr);
  });
}

function setHierPhaseUI(phase,mergeIdx){
  const method=document.getElementById('linkage-method').value;
  const mName={single:'最近法',complete:'最遠法',ward:'ウォード法'}[method];
  const total=hMerges.length;
  const pl=document.getElementById('hier-phase-label');
  const infoEl=document.getElementById('hier-info');
  document.getElementById('hier-step-info').textContent=`結合 ${mergeIdx} / ${total}`;
  if(phase==='init'){
    pl.className='phase-label phase-measure'; pl.textContent='① 距離を測る';
    infoEl.className='info-box info-neutral';
    infoEl.textContent='「次へ」で距離の計測から始まります。点はクリックで移動できます。';
  } else if(phase==='measure'){
    const m=hMerges[mergeIdx],min=m.allDists.find(d=>d.isMin);
    pl.className='phase-label phase-measure'; pl.textContent='① 距離を測る';
    infoEl.className='info-box info-measure';
    infoEl.innerHTML=`${mName}で全クラスタ間の距離を計算。<br>最小：${min.la} と ${min.lb}（距離 = ${m.d.toFixed(1)}）→ この2つを次で結合。`;
  } else if(phase==='merged'){
    const m=hMerges[mergeIdx-1],min=m.allDists.find(d=>d.isMin);
    pl.className='phase-label phase-merge'; pl.textContent='② クラスタを結合';
    infoEl.className='info-box info-merge';
    infoEl.innerHTML=`${min.la} と ${min.lb} を結合（距離 ${m.d.toFixed(1)}）。残り ${hClusters.length} クラスタ。`;
  } else if(phase==='done'){
    pl.className='phase-label phase-merge'; pl.textContent='完了';
    infoEl.className='info-box info-merge';
    infoEl.textContent='すべてのクラスタが1つに結合されました。';
    document.getElementById('btn-step').disabled=true;
  }
}

function stepHier(){
  if(hPhase==='init'||hPhase==='merged'){
    if(hMergeIdx>=hMerges.length){hPhase='done';setHierPhaseUI('done',hMergeIdx);clearInterval(hAutoTimer);return;}
    hPhase='measure';
    const m=hMerges[hMergeIdx];
    updateDistTable(m.allDists);
    drawHierWithDistances(m);
    drawDend(hMergeIdx);
    setHierPhaseUI('measure',hMergeIdx);
  } else if(hPhase==='measure'){
    const m=hMerges[hMergeIdx];
    const merged=[...hClusters[m.mi],...hClusters[m.mj]];
    hClusters=hClusters.filter((_,k)=>k!==m.mi&&k!==m.mj);
    hClusters.push(merged);
    hMergeIdx++;
    hPhase='merged';
    drawHier(); drawDend(hMergeIdx);
    setHierPhaseUI('merged',hMergeIdx);
    if(hMergeIdx>=hMerges.length) setTimeout(()=>{hPhase='done';setHierPhaseUI('done',hMergeIdx);clearInterval(hAutoTimer);},0);
  }
}

function autoHier(){
  clearInterval(hAutoTimer);
  hAutoTimer=setInterval(()=>{if(hPhase==='done'){clearInterval(hAutoTimer);return;}stepHier();},1100);
}

function drawHierWithDistances(m){
  const cv=document.getElementById('hierCanvas'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const method=document.getElementById('linkage-method').value;
  hClusters.forEach((cl,ci)=>{
    if(cl.length>1){
      ctx.beginPath();cl.map(i=>hPts[i]).forEach((p,pi)=>pi===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      ctx.closePath();ctx.fillStyle=LCOLORS[ci%LCOLORS.length]+'44';ctx.fill();
    }
  });
  m.allDists.forEach(({ca,cb,d,isMin})=>{
    const{ax,ay,bx,by}=getLineEndpoints(ca,cb,method);
    const mx=(ax+bx)/2,my=(ay+by)/2;
    if(isMin){
      ctx.save();ctx.strokeStyle='#E24B4A';ctx.lineWidth=2.5;ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
      ctx.fillStyle='#E24B4A';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
      ctx.fillText(d.toFixed(1),mx,my-6);ctx.restore();
    } else {
      ctx.save();ctx.strokeStyle='#bbb';ctx.lineWidth=1;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
      ctx.fillStyle='#bbb';ctx.font='10px sans-serif';ctx.textAlign='center';
      ctx.fillText(d.toFixed(1),mx,my-5);ctx.restore();
    }
  });
  ctx.setLineDash([]);
  drawHPoints(ctx);
}

function drawHier(){
  const cv=document.getElementById('hierCanvas'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  hClusters.forEach((cl,ci)=>{
    if(cl.length>1){
      ctx.beginPath();cl.map(i=>hPts[i]).forEach((p,pi)=>pi===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      ctx.closePath();ctx.fillStyle=LCOLORS[ci%LCOLORS.length]+'55';ctx.fill();
    }
  });
  drawHPoints(ctx);
}

function drawHPoints(ctx){
  hClusters.forEach((cl,ci)=>{
    const color=COLORS[ci%COLORS.length];
    const merged=cl.length>1;
    cl.forEach(i=>{
      const p=hPts[i];
      ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);
      if(merged){
        // 結合済み：白抜き（塗りなし・枠線のみ）
        ctx.fillStyle='#fff';ctx.fill();
        ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();
      } else {
        // 単独：塗りつぶし
        ctx.fillStyle=color;ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      }
      ctx.fillStyle='#555';ctx.font='10px sans-serif';ctx.textAlign='left';
      ctx.fillText(i+1,p.x+8,p.y+4);
    });
  });
}

function drawDend(upTo){
  const cv=document.getElementById('dendCanvas'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const n=hPts.length,pL=28,pR=16,pT=16,pB=28;
  const W=cv.width-pL-pR,H=cv.height-pT-pB;
  const nX={};
  hPts.forEach((_,i)=>{nX[`l${i}`]=(i+0.5)*(W/n);});
  const maxD=hMerges.length>0?Math.max(...hMerges.map(m=>m.d))*1.1:1;
  hPts.forEach((_,i)=>{
    const x=pL+nX[`l${i}`],y=pT+H;
    ctx.strokeStyle='#ccc';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+5);ctx.stroke();
    ctx.fillStyle='#888';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(i+1,x,y+15);
  });
  let cls=hPts.map((_,i)=>[i]);
  const keys=hPts.map((_,i)=>`l${i}`);
  for(let s=0;s<Math.min(upTo,hMerges.length);s++){
    const{mi,mj,d}=hMerges[s];
    const xi=pL+nX[keys[mi]],xj=pL+nX[keys[mj]];
    const y=pT+H*(1-d/maxD);
    ctx.strokeStyle=COLORS[s%COLORS.length];ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(xi,pT+H);ctx.lineTo(xi,y);ctx.lineTo(xj,y);ctx.lineTo(xj,pT+H);ctx.stroke();
    const nk=`m${s}`;nX[nk]=((xi+xj)/2)-pL;
    cls=cls.filter((_,k)=>k!==mi&&k!==mj);cls.push([]);
    keys.splice(mi,1);keys.splice(mi<=mj?mj-1:mj,1);keys.push(nk);
  }
}

function hierClick(e){
  const cv=document.getElementById('hierCanvas'),r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(cv.width/r.width),my=(e.clientY-r.top)*(cv.height/r.height);
  let ni=-1,nd=Infinity;
  hPts.forEach((p,i)=>{const d=dist(p,{x:mx,y:my});if(d<nd){nd=d;ni=i;}});
  if(nd<20){hPts[ni]={x:Math.max(15,Math.min(275,mx)),y:Math.max(15,Math.min(265,my))};resetHier();}
}

/* =====================================================================
   k-means
   資料の手順に完全に対応：
     手順1：各点にランダムにクラスタを割り当てる
     手順2：クラスタの重心を計算する（× 印で表示）
     手順3：各点を最近の重心のクラスタに再割り当て
     手順4：変化がなければ終了、あれば手順2へ
   ===================================================================== */
let kmPts=[], kmAssign=[], kmCentroids=[], kmStep=0, kmPhase='init', kmAutoT=null;

function initKmeans(){
  kmPts=[
    {x:80,y:70},{x:110,y:55},{x:95,y:100},{x:70,y:50},{x:120,y:85},
    {x:220,y:65},{x:250,y:85},{x:235,y:50},{x:200,y:95},{x:265,y:65},
    {x:150,y:190},{x:170,y:220},{x:130,y:210},{x:160,y:185},{x:185,y:210},
    {x:290,y:170},{x:270,y:195},{x:310,y:200},{x:285,y:220},{x:320,y:175}
  ];
  resetKmeans();
}

function resetKmeans(){
  clearInterval(kmAutoT);
  kmAssign=[]; kmCentroids=[]; kmStep=0; kmPhase='init';
  document.getElementById('btn-km-step').disabled=false;
  setKmPhaseUI('init');
  drawKm();
}

function calcCentroids(){
  const k=parseInt(document.getElementById('k-slider').value);
  return Array.from({length:k},(_,ci)=>{
    const pts=kmPts.filter((_,i)=>kmAssign[i]===ci);
    if(!pts.length) return null;
    return{x:pts.reduce((s,p)=>s+p.x,0)/pts.length,
           y:pts.reduce((s,p)=>s+p.y,0)/pts.length};
  });
}

function setKmPhaseUI(phase,changed){
  const k=parseInt(document.getElementById('k-slider').value);
  const pl=document.getElementById('km-phase-label');
  const inf=document.getElementById('km-info');
  document.getElementById('km-step-info').textContent=`ステップ ${kmStep}`;
  if(phase==='init'){
    pl.className='phase-label phase-measure'; pl.textContent='手順1：ランダム割り当て前';
    inf.className='info-box info-neutral';
    inf.textContent=`「次のステップ」で各点に k=${k} のクラスタをランダムに割り当てます（手順1）。`;
  } else if(phase==='assigned'){
    pl.className='phase-label phase-measure'; pl.textContent='手順1 完了：ランダム割り当て';
    inf.className='info-box info-measure';
    inf.textContent=`各点にランダムにクラスタを割り当てました（手順1）。次は各クラスタの重心を計算します（手順2）。`;
  } else if(phase==='centroid'){
    pl.className='phase-label phase-measure'; pl.textContent='手順2 完了：重心を計算';
    inf.className='info-box info-measure';
    inf.textContent='各クラスタの重心（×印）を計算しました（手順2）。次は各点を最近の重心のクラスタに割り当て直します（手順3）。';
  } else if(phase==='reassigned'){
    if(changed){
      pl.className='phase-label phase-measure'; pl.textContent='手順3 完了：再割り当て';
      inf.className='info-box info-measure';
      inf.textContent='各点を最近の重心に割り当て直しました（手順3）。変化があったので手順2に戻ります（手順4）。';
    } else {
      pl.className='phase-label phase-merge'; pl.textContent='手順4：収束・終了';
      inf.className='info-box info-merge';
      inf.textContent='割り当ての変化がなくなりました。アルゴリズム完了です（手順4）。';
      document.getElementById('btn-km-step').disabled=true;
      clearInterval(kmAutoT);
    }
  }
}

function stepKmeans(){
  const k=parseInt(document.getElementById('k-slider').value);
  if(kmPhase==='init'){
    // 手順1：各点にランダムにクラスタを割り当てる
    kmAssign=kmPts.map(()=>Math.floor(Math.random()*k));
    kmCentroids=[];
    kmStep++; kmPhase='assigned';
    setKmPhaseUI('assigned');
    drawKm();
  } else if(kmPhase==='assigned'){
    // 手順2：重心を計算
    kmCentroids=calcCentroids();
    kmStep++; kmPhase='centroid';
    setKmPhaseUI('centroid');
    drawKm();
  } else if(kmPhase==='centroid'){
    // 手順3：再割り当て
    const prev=[...kmAssign];
    kmPts.forEach((p,i)=>{
      let best=0,bd=Infinity;
      kmCentroids.forEach((c,ci)=>{
        if(!c) return;
        const d=dist(p,c);
        if(d<bd){bd=d;best=ci;}
      });
      kmAssign[i]=best;
    });
    const changed=prev.some((a,i)=>a!==kmAssign[i]);
    kmStep++; kmPhase=changed?'reassigned_changed':'reassigned_done';
    setKmPhaseUI('reassigned',changed);
    drawKm();
  } else if(kmPhase==='reassigned_changed'){
    // 手順4：変化あり → 手順2へ（重心再計算）
    kmCentroids=calcCentroids();
    kmStep++; kmPhase='centroid';
    setKmPhaseUI('centroid');
    drawKm();
  }
}

function autoKmeans(){
  clearInterval(kmAutoT);
  kmAutoT=setInterval(()=>{
    if(kmPhase==='reassigned_done'){clearInterval(kmAutoT);return;}
    stepKmeans();
  },1000);
}

function drawKm(){
  const cv=document.getElementById('kmCanvas'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  // 接続線（割り当て済みかつ重心あり）
  if(kmCentroids.length>0){
    kmPts.forEach((p,i)=>{
      const ci=kmAssign[i];
      if(ci===undefined||ci<0||!kmCentroids[ci]) return;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(kmCentroids[ci].x,kmCentroids[ci].y);
      ctx.strokeStyle=LCOLORS[ci%LCOLORS.length];ctx.lineWidth=0.8;ctx.stroke();
    });
  }
  // 点
  kmPts.forEach((p,i)=>{
    const ci=kmAssign[i];
    const color=(ci>=0)?COLORS[ci%COLORS.length]:'#ccc';
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);
    ctx.fillStyle=color;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  });
  // 重心（×印）
  kmCentroids.forEach((c,ci)=>{
    if(!c) return;
    ctx.strokeStyle=COLORS[ci%COLORS.length];ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(c.x-9,c.y-9);ctx.lineTo(c.x+9,c.y+9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(c.x+9,c.y-9);ctx.lineTo(c.x-9,c.y+9);ctx.stroke();
  });
}

function kmClick(e){
  const cv=document.getElementById('kmCanvas'),r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(cv.width/r.width),my=(e.clientY-r.top)*(cv.height/r.height);
  let ni=-1,nd=Infinity;
  kmPts.forEach((p,i)=>{const d=dist(p,{x:mx,y:my});if(d<nd){nd=d;ni=i;}});
  if(nd<20){kmPts[ni]={x:Math.max(10,Math.min(670,mx)),y:Math.max(10,Math.min(290,my))};resetKmeans();}
}

function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

initHier();
initKmeans();
</script>
